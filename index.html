<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1A64C8">
  <meta name="description" content="Learn to tell the time from analog and digital clocks.">
  <title>Learning Clock</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <!-- The Clock Hub clock screen. src/app.js fills in the time and sets the
       layout (data-shape) and sizes (CSS variables) from the space inside
       the screen's safe area. -->
  <!-- Behind everything: the time-of-day scene painted in the look, then the
       look's corner pictures and motifs. -->
  <div class="scene" id="scene" aria-hidden="true"></div>
  <div class="decor" id="decor" aria-hidden="true"></div>

  <main class="screen" id="screen">
  <div class="layout" id="layout" data-shape="wide">
    <h1 class="visually-hidden">Learning Clock</h1>

    <!-- The header row: room for the calendar button once it is built, and the
         grown-up lock (which joins the bottom row in the in-between layout). -->
    <div class="header"></div>
    <button type="button" class="lock-button" id="lock-button" aria-label="Grown-up settings" aria-haspopup="dialog">
      <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2.2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    </button>

    <div class="clock-area">
      <div class="clock" id="clock"></div>
      <button type="button" class="ampm" id="ampm">
        <span class="ampm-option" data-period="AM">AM</span>
        <span class="ampm-option" data-period="PM">PM</span>
      </button>
    </div>

    <section class="card words" aria-label="The time in words">
      <p class="sentence" id="sentence"></p>
    </section>

    <section class="card digital twelve">
      <h2 class="card-label">12-hour</h2>
      <p class="digits">
        <span class="digits-time"><span id="h12"></span>:<span id="m12"></span></span>
        <span class="digits-period" id="period"></span>
      </p>
    </section>

    <section class="card digital twenty-four">
      <h2 class="card-label">24-hour</h2>
      <p class="digits">
        <span class="digits-time"><span id="h24"></span>:<span id="m24"></span></span>
      </p>
    </section>

    <div class="tools">
      <!-- One sign in one place: "Now" while following the real time, the
           "Back to now" button once the time is set by hand. -->
      <div class="now-sign" id="now-sign" role="status" aria-label="Showing the real time" tabindex="-1">
        <span class="now-dot" aria-hidden="true"></span><span class="now-label">Now</span>
      </div>
      <button type="button" class="back-to-now" id="back-to-now" aria-label="Back to the real time" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4.5v4.5H8"/><path d="M12 8v4.2l2.8 1.8"/></svg>
        <span class="back-label">Back to now</span>
      </button>
      <button type="button" class="tool-button" id="look-button" aria-label="Change the look" aria-haspopup="dialog">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18c1.1 0 1.7-.8 1.7-1.6 0-1.2-1-1.6-1-2.6 0-.9.7-1.6 1.6-1.6H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11.5" r="1.3"/><circle cx="10" cy="7.3" r="1.3"/><circle cx="14.8" cy="7.3" r="1.3"/></svg>
      </button>
    </div>

    <!-- The look picker: six looks, then the hour and minute colours.
         src/look-picker.js fills in the tiles. -->
    <dialog class="panel" id="look-picker" aria-labelledby="look-picker-title">
      <div class="panel-head">
        <svg class="panel-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18c1.1 0 1.7-.8 1.7-1.6 0-1.2-1-1.6-1-2.6 0-.9.7-1.6 1.6-1.6H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11.5" r="1.3"/><circle cx="10" cy="7.3" r="1.3"/><circle cx="14.8" cy="7.3" r="1.3"/></svg>
        <h2 class="panel-title" id="look-picker-title">Pick a look</h2>
        <button type="button" class="panel-close" id="look-picker-close" aria-label="Close">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="look-tiles" id="look-tiles"></div>
      <section class="pair-section" id="pair-section" aria-labelledby="pair-title">
        <h3 class="pair-title" id="pair-title">Hour and minute colours</h3>
        <div class="pair-tiles" id="pair-tiles"></div>
      </section>
    </dialog>

    <!-- The grown-up check, then the settings, in one panel.
         src/grown-up-panel.js runs it. -->
    <dialog class="panel" id="grown-up" aria-labelledby="grown-up-title">
      <div class="panel-head">
        <svg class="panel-icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2.2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <h2 class="panel-title" id="grown-up-title">For grown-ups</h2>
        <button type="button" class="panel-close" id="grown-up-close" aria-label="Close">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <section class="gate" id="gate">
        <p class="gate-help">Answer the times-table question to open the settings.</p>
        <p class="gate-question" id="gate-question"></p>
        <div class="gate-entry" aria-live="polite">
          <p class="gate-typed" id="gate-typed"></p>
          <p class="gate-wrong" id="gate-wrong" hidden>Not quite. Try again.</p>
        </div>
        <div class="number-pad" id="number-pad">
          <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
          <button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button>
          <button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button>
          <span aria-hidden="true"></span>
          <button type="button" data-key="0">0</button>
          <button type="button" class="pad-delete" data-key="delete" aria-label="Delete">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 5h11v14H9l-6-7z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></svg>
          </button>
        </div>
      </section>

      <section class="settings" id="settings" hidden>
        <div class="setting-rows" id="setting-rows"></div>
        <div class="settings-foot">
          <span class="reset-note" id="reset-note" role="status"></span>
          <button type="button" class="quiet-button" id="undo-reset" hidden>Undo</button>
          <button type="button" class="quiet-button" id="reset-settings">Reset to defaults</button>
          <button type="button" class="done-button" id="settings-done">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>Done</span>
          </button>
        </div>
      </section>
    </dialog>
  </div>
  </main>
</body>
</html>
